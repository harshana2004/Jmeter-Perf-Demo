
name: JMeter Performance Test

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Download JMeter
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            -o apache-jmeter-5.6.3.tgz \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz

          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Create results directory
        run: |
          mkdir -p results

      - name: Run Smoke Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=1 \
            -Jrampup=1 \
            -Jloops=1 \
            -l results/smoke.jtl

      - name: Run Load Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=10 \
            -Jrampup=30 \
            -Jloops=5 \
            -l results/load.jtl

      - name: Run Stress Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=50 \
            -Jrampup=60 \
            -Jloops=5 \
            -l results/stress.jtl

      - name: Run Spike Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=100 \
            -Jrampup=1 \
            -Jloops=2 \
            -l results/spike.jtl

      - name: Combine JMeter results
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          files = [
              ("Smoke", Path("results/smoke.jtl")),
              ("Load", Path("results/load.jtl")),
              ("Stress", Path("results/stress.jtl")),
              ("Spike", Path("results/spike.jtl")),
          ]

          output = Path("results/combined-results.jtl")

          header = None
          rows = []

          for scenario, filename in files:
              with filename.open(newline="") as f:
                  reader = csv.DictReader(f)

                  if header is None:
                      header = reader.fieldnames

                  for row in reader:
                      row["label"] = f"{scenario} | {row['label']}"
                      rows.append(row)

          with output.open("w", newline="") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=header,
                  extrasaction="ignore"
              )
              writer.writeheader()
              writer.writerows(rows)

          print(f"Created {output}")
          print(f"Total samples: {len(rows)}")
          PY

      - name: Validate combined JTL
        run: |
          echo "Combined JTL:"
          head -5 results/combined-results.jtl

          echo "Number of result rows:"
          tail -n +2 results/combined-results.jtl | wc -l

      - name: Generate HTML Report
        run: |
          rm -rf reports/performance-report
          mkdir -p reports/performance-report

          ./apache-jmeter-5.6.3/bin/jmeter \
            -g results/combined-results.jtl \
            -e \
            -o reports/performance-report

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-report
          path: reports/performance-report

      - name: Upload JMeter Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/*.jtl
