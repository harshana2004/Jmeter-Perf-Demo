
name: JMeter Performance Test

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  performance-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'

      - name: Download JMeter
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            -o apache-jmeter-5.6.3.tgz \
            https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz

          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Create results directory
        run: mkdir -p results

      - name: Test API Connectivity
        run: |
          echo "Checking JSONPlaceholder API..."

          curl -fsS --max-time 30 -o /dev/null \
            https://jsonplaceholder.typicode.com/users

          curl -fsS --max-time 30 -o /dev/null \
            https://jsonplaceholder.typicode.com/posts

          echo "API connectivity checks passed."

      - name: Run Smoke Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=1 \
            -Jrampup=1 \
            -Jloops=1 \
            -l results/smoke.jtl

      - name: Run Load Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=10 \
            -Jrampup=30 \
            -Jloops=5 \
            -l results/load.jtl

      - name: Run Stress Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=50 \
            -Jrampup=60 \
            -Jloops=5 \
            -l results/stress.jtl

      - name: Run Spike Test
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t api-load-test.jmx \
            -Jusers=100 \
            -Jrampup=1 \
            -Jloops=2 \
            -l results/spike.jtl

      - name: Validate JMeter Results
        run: |
          set -e

          for file in \
            results/smoke.jtl \
            results/load.jtl \
            results/stress.jtl \
            results/spike.jtl
          do
            echo "Checking $file"

            if [ ! -f "$file" ]; then
              echo "::error::Missing result file: $file"
              exit 1
            fi

            lines=$(wc -l < "$file")

            if [ "$lines" -le 1 ]; then
              echo "::error::$file contains no samples"
              exit 1
            fi

            echo "Samples: $((lines - 1))"
          done

          echo "All result files contain samples."

      - name: Check Failed Samples
        run: |
          python3 - <<'PY'
          import csv
          import sys
          from pathlib import Path

          files = [
              Path("results/smoke.jtl"),
              Path("results/load.jtl"),
              Path("results/stress.jtl"),
              Path("results/spike.jtl"),
          ]

          total_samples = 0
          total_failures = 0

          for path in files:
              with path.open(newline="") as f:
                  reader = csv.DictReader(f)
                  rows = list(reader)

              failures = [
                  row for row in rows
                  if row.get("success", "").strip().lower() != "true"
              ]

              print(
                  f"{path.name}: {len(rows)} samples, "
                  f"{len(failures)} failed"
              )

              total_samples += len(rows)
              total_failures += len(failures)

          print(f"Total samples: {total_samples}")
          print(f"Total failed samples: {total_failures}")

          if total_samples == 0:
              print("ERROR: No samples were recorded.")
              sys.exit(1)

          if total_failures:
              print("ERROR: One or more JMeter samples failed.")
              sys.exit(1)

          print("All JMeter samples passed.")
          PY

      - name: Combine JMeter Results
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          files = [
              ("Smoke", Path("results/smoke.jtl")),
              ("Load", Path("results/load.jtl")),
              ("Stress", Path("results/stress.jtl")),
              ("Spike", Path("results/spike.jtl")),
          ]

          output = Path("results/combined-results.jtl")
          header = None
          rows = []

          for scenario, filename in files:
              print(f"Reading {filename}")

              with filename.open(newline="") as f:
                  reader = csv.DictReader(f)

                  if header is None:
                      header = reader.fieldnames

                  for row in reader:
                      row["label"] = f"{scenario} | {row['label']}"
                      rows.append(row)

          if not header or not rows:
              raise RuntimeError("No JMeter samples found to combine.")

          with output.open("w", newline="") as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=header,
                  extrasaction="ignore"
              )
              writer.writeheader()
              writer.writerows(rows)

          print(f"Created {output}")
          print(f"Total samples: {len(rows)}")
          PY

      - name: Validate Combined JTL
        run: |
          lines=$(wc -l < results/combined-results.jtl)
          samples=$((lines - 1))

          echo "Combined samples: $samples"

          if [ "$samples" -le 0 ]; then
            echo "::error::Combined JTL contains no samples."
            exit 1
          fi

      - name: Generate HTML Report
        run: |
          rm -rf reports/performance-report
          mkdir -p reports

          ./apache-jmeter-5.6.3/bin/jmeter \
            -g results/combined-results.jtl \
            -e \
            -o reports/performance-report

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-report
          path: reports/performance-report/
          if-no-files-found: error

      - name: Upload JMeter Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/*.jtl
          if-no-files-found: error
